<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='styling/style.css') }}">

        <title>Rack &middot; TKA Inventory</title>
    </head>
    <body>
        <header class="topbar">
            <div class="topbar__brand">
                <span class="topbar__mark">TKA</span>
                <h1 class="topbar__title">Inventory</h1>
            </div>

            <nav class="breadcrumb" aria-label="Location">
                <span class="breadcrumb__item">Building V</span>
                <span class="breadcrumb__sep" aria-hidden="true">/</span>
                <a class="breadcrumb__item breadcrumb__link" href="{{ url_for('index') }}">V-101 &middot; Robotics Storage</a>
                <span class="breadcrumb__sep" aria-hidden="true">/</span>
                <span class="breadcrumb__item breadcrumb__item--current">
                    Rack <span data-fill="number">—</span> &middot; <span data-fill="items">—</span>
                </span>
            </nav>

            <div class="topbar__actions">
                <input class="search" type="search" placeholder="Search for an item&hellip;" aria-label="Search inventory">
            </div>
        </header>

        <main class="stage">
            <div class="board board--std">
                <div class="board__head">
                    <span class="hex" aria-hidden="true" data-fill="number">—</span>
                    <div>
                        <h2 class="board__title" data-fill="items">—</h2>
                        <p class="board__sub">Standard rack &middot; shelf elevation</p>
                    </div>
                    <a class="backlink" href="{{ url_for('index') }}">&larr; Floor plan</a>
                </div>

                <!-- Shelves are drawn from the registry by rack.js. -->
                <div class="board__bays"></div>
            </div>

            <aside class="panel" aria-label="Item index">
                <h2 class="panel__title">Item Index</h2>
                <div class="index-scroll">
                <table class="index">
                    <thead>
                        <tr><th scope="col">Shelf</th><th scope="col">Stored Items</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
                </div>
                <p class="panel__hint">Select a slot on the rack or in the table to drill into its items.</p>
            </aside>
        </main>

        <script src="{{ url_for('static', filename='scripts/racks-data.js') }}"></script>
        <script src="{{ url_for('static', filename='scripts/rack.js') }}"></script>
    </body>
</html>
