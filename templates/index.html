<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='styling/style.css') }}">

        <title>TKA Inventory &middot; Floor Plan</title>
    </head>
    <body>
        <header class="topbar">
            <div class="topbar__brand">
                <span class="topbar__mark">TKA</span>
                <h1 class="topbar__title">Inventory</h1>
            </div>

            <nav class="breadcrumb" aria-label="Location">
                <span class="breadcrumb__item">Building V</span>
                <span class="breadcrumb__sep" aria-hidden="true">/</span>
                <span class="breadcrumb__item breadcrumb__item--current">V-101 &middot; Robotics Storage</span>
            </nav>

            <div class="topbar__actions">
                <input class="search" type="search" placeholder="Search for an item&hellip;" aria-label="Search inventory">
            </div>
        </header>

        <main class="stage">
            <!--
                Every zone is positioned with percentage custom properties
                (--x/--y/--w/--h) so the whole plan scales as one unit.
            -->
            <div class="plan" role="group" aria-label="V-101 Robotics Storage floor plan">

                <!-- ============ TOP WALL ============ -->
                <button type="button" class="zone zone--tent" style="--x:2.7; --y:3.0; --w:16.1; --h:2.9" data-zone="tent-a">
                    <span class="zone__label">Tent</span>
                </button>
                <button type="button" class="zone zone--dollies" style="--x:4.0; --y:6.3; --w:14.1; --h:2.4" data-zone="dollies">
                    <span class="zone__label">Dollies</span>
                </button>
                <button type="button" class="zone zone--tent" style="--x:2.7; --y:9.1; --w:16.1; --h:2.9" data-zone="tent-b">
                    <span class="zone__label">Tent</span>
                </button>

                <div class="decor decor--crate" style="--x:20.8; --y:3.0; --w:3.4; --h:2.6" aria-hidden="true"></div>
                <div class="decor decor--crate" style="--x:20.8; --y:6.3; --w:3.4; --h:2.6" aria-hidden="true"></div>

                <button type="button" class="zone zone--field" style="--x:26.2; --y:3.2; --w:21.5; --h:5.7" data-zone="field-material">
                    <span class="zone__label">Field Material</span>
                    <span class="zone__label zone__label--mark">Corner Dollies</span>
                </button>

                <button type="button" class="zone zone--dark" style="--x:49.0; --y:3.0; --w:22.8; --h:4.2" data-zone="outreach">
                    <span class="zone__label">Outreach</span>
                </button>

                <button type="button" class="zone zone--mesh" style="--x:72.5; --y:2.5; --w:9.1; --h:9.2" data-zone="metal-stock">
                    <span class="zone__label">Metal<br>Stock</span>
                </button>

                <button type="button" class="zone zone--mark" style="--x:81.9; --y:2.2; --w:7.8; --h:2.9" data-zone="sheet-stock">
                    <span class="zone__label">Sheet Stock</span>
                </button>
                <div class="decor decor--bars" style="--x:81.9; --y:5.4; --w:7.8; --h:5.4" aria-hidden="true"></div>

                <button type="button" class="zone zone--wood" style="--x:90.2; --y:2.5; --w:7.8; --h:9.7" data-zone="lumber" aria-label="Lumber stock"></button>

                <!-- ============ LEFT WALL ============ -->
                <div class="wheels" style="--x:2.8; --y:13.2; --w:23.0; --h:9.0" aria-label="Wheel stock">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                </div>

                <button type="button" class="zone zone--rack zone--rack-v" style="--x:3.0; --y:23.9; --w:4.9; --h:11.7" data-zone="wall-rack-a" aria-label="Wall rack A"></button>
                <button type="button" class="zone zone--rack zone--rack-v zone--rack-dark" style="--x:3.0; --y:38.1; --w:4.9; --h:5.1" data-zone="wall-rack-b" aria-label="Wall rack B"></button>

                <div class="door door--left" style="--x:4.2; --y:51.5; --w:7.0; --h:5.3" aria-hidden="true"></div>
                <button type="button" class="zone zone--dark zone--vertical" style="--x:3.4; --y:54.3; --w:8.1; --h:10.7" data-zone="robotics-parts">
                    <span class="zone__label">Robotics Parts</span>
                </button>
                <div class="decor decor--beam" style="--x:12.1; --y:55.6; --w:13.4; --h:0.9" aria-hidden="true"></div>
                <div class="door door--left" style="--x:4.2; --y:65.5; --w:7.0; --h:5.3" aria-hidden="true"></div>

                <!-- ============ RIGHT WALL ============ -->
                <button type="button" class="zone zone--mark zone--vertical" style="--x:90.4; --y:13.2; --w:5.6; --h:6.6" data-zone="wiring">
                    <span class="zone__label">Wiring</span>
                </button>
                <button type="button" class="zone zone--mark zone--vertical" style="--x:90.4; --y:20.8; --w:5.6; --h:6.6" data-zone="power-cords">
                    <span class="zone__label">Power Cords</span>
                </button>
                <button type="button" class="zone zone--mark zone--vertical" style="--x:90.4; --y:28.2; --w:5.6; --h:4.3" data-zone="bin-7484">
                    <span class="zone__label">7484</span>
                </button>
                <button type="button" class="zone zone--mark zone--vertical" style="--x:90.4; --y:33.5; --w:5.6; --h:5.1" data-zone="sheets">
                    <span class="zone__label">Sheets</span>
                </button>

                <div class="decor decor--valve" style="--x:92.0; --y:42.1; --w:4.0; --h:3.1" aria-hidden="true"></div>
                <div class="door door--right" style="--x:88.8; --y:51.5; --w:7.0; --h:5.3" aria-hidden="true"></div>

                <button type="button" class="zone zone--dark zone--vertical" style="--x:90.2; --y:56.3; --w:5.8; --h:9.7" data-zone="robotics-tools">
                    <span class="zone__label">Robotics Tools</span>
                </button>

                <!-- ============ FLOOR SHELVING ============ -->
                <button type="button" class="zone zone--rack" style="--x:24.8; --y:28.9; --w:9.4; --h:8.1" data-zone="rack-a1" aria-label="Rack A1"></button>
                <button type="button" class="zone zone--rack" style="--x:24.8; --y:40.1; --w:9.4; --h:10.7" data-zone="rack-a2" aria-label="Rack A2"></button>
                <button type="button" class="zone zone--rack" style="--x:24.8; --y:53.8; --w:9.4; --h:12.7" data-zone="rack-a3" aria-label="Rack A3"></button>

                <button type="button" class="zone zone--rack" style="--x:49.7; --y:23.9; --w:9.4; --h:11.2" data-zone="rack-b1" aria-label="Rack B1"></button>
                <button type="button" class="zone zone--rack" style="--x:49.7; --y:38.1; --w:9.4; --h:12.2" data-zone="rack-b2" aria-label="Rack B2"></button>
                <button type="button" class="zone zone--rack" style="--x:49.7; --y:52.3; --w:9.4; --h:10.7" data-zone="rack-b3" aria-label="Rack B3"></button>

                <button type="button" class="zone zone--rack" style="--x:73.2; --y:37.6; --w:8.7; --h:10.2" data-zone="rack-c1" aria-label="Rack C1"></button>
                <button type="button" class="zone zone--rack" style="--x:73.2; --y:52.8; --w:8.7; --h:10.2" data-zone="rack-c2" aria-label="Rack C2"></button>

                <!-- ============ WORKBENCH ROW ============ -->
                <div class="decor decor--stool" style="--x:45.6; --y:81.2; --w:5.4; --h:4.2" aria-hidden="true"></div>
                <div class="decor decor--stool" style="--x:55.0; --y:81.2; --w:5.4; --h:4.2" aria-hidden="true"></div>
                <div class="decor decor--stool" style="--x:80.5; --y:81.2; --w:5.4; --h:4.2" aria-hidden="true"></div>
                <div class="decor decor--stool" style="--x:90.0; --y:81.2; --w:5.4; --h:4.2" aria-hidden="true"></div>

                <button type="button" class="zone zone--bench" style="--x:45.6; --y:85.8; --w:18.8; --h:7.1" data-zone="bench-a" aria-label="Workbench A"></button>
                <button type="button" class="zone zone--rack" style="--x:65.8; --y:86.8; --w:10.7; --h:4.6" data-zone="bench-shelf" aria-label="Bench shelf"></button>
                <button type="button" class="zone zone--bench" style="--x:78.5; --y:85.8; --w:18.1; --h:7.1" data-zone="bench-b" aria-label="Workbench B"></button>

                <!-- ============ ROOM LABELS ============ -->
                <div class="room-name" style="--x:18.0; --y:69.0; --w:34.0; --h:8.0">Robotics<br>Storage</div>
                <div class="room-code">V &ndash; 101</div>
            </div>

            <aside class="legend" aria-label="Legend">
                <h2 class="legend__title">Legend</h2>
                <ul class="legend__list">
                    <li><i class="swatch swatch--mark"></i>Labeled bin / stock</li>
                    <li><i class="swatch swatch--rack"></i>Shelving rack</li>
                    <li><i class="swatch swatch--dark"></i>Cabinet / tool chest</li>
                    <li><i class="swatch swatch--wood"></i>Workbench</li>
                    <li><i class="swatch swatch--dollies"></i>Dollies &amp; carts</li>
                    <li><i class="swatch swatch--crate"></i>Crate</li>
                </ul>
                <p class="legend__hint">Select any zone to drill into its contents.</p>
            </aside>
        </main>

        <script src="{{ url_for('static', filename='scripts/main.js') }}"></script>
    </body>
</html>
