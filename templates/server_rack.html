<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='styling/style.css') }}">

        <title>Server Rack &middot; TKA Inventory</title>
    </head>
    <body>
        <header class="topbar">
            <div class="topbar__brand">
                <span class="topbar__mark">TKA</span>
                <h1 class="topbar__title">Inventory</h1>
            </div>

            <nav class="breadcrumb" aria-label="Location">
                <span class="breadcrumb__item">Building V</span>
                <span class="breadcrumb__sep" aria-hidden="true">/</span>
                <a class="breadcrumb__item breadcrumb__link" href="{{ url_for('index') }}">V-101 &middot; Robotics Storage</a>
                <span class="breadcrumb__sep" aria-hidden="true">/</span>
                <span class="breadcrumb__item breadcrumb__item--current">
                    Rack <span data-fill="number">&mdash;</span> &middot; <span data-fill="items">&mdash;</span>
                </span>
            </nav>

            <div class="topbar__actions">
                <input class="search" type="search" placeholder="Search for an item&hellip;" aria-label="Search inventory">
            </div>
        </header>

        <main class="stage">
            <!--
                Server rack: Front side / Back side faces.

                Each face is  .bay__shelf (the carcass, scrolls down)
                wrapping      .bay__track (the column of slots, grows down).
                Appending a slot to a track is all it takes to add an item —
                the face starts scrolling on its own once the track is taller.

                rack.js builds these from the registry.
            -->
            <div class="board board--server">
                <div class="board__head">
                    <span class="hex" aria-hidden="true" data-fill="number">&mdash;</span>
                    <div>
                        <h2 class="board__title" data-fill="items">&mdash;</h2>
                        <p class="board__sub">Server rack &middot; <span data-fill="bays">&mdash;</span></p>
                    </div>
                    <a class="backlink" href="{{ url_for('index') }}">&larr; Floor plan</a>
                </div>

                <div class="board__bays"></div>
            </div>

            <aside class="panel" aria-label="Item index">
                <h2 class="panel__title">Item Index</h2>
                <!-- face > item class > items, built by rack.js -->
                <div class="index-scroll">
                    <div class="tree"></div>
                </div>
                <p class="panel__hint">Click an item class &mdash; on the rack or here &mdash; to see what it holds. Hovering either side lines the two up.</p>
            </aside>
        </main>

        <script>
            // Resolved by Flask so the front end never hardcodes a path.
            window.INVENTORY_URL = "{{ url_for('inventory') }}";
        </script>
        <script src="{{ url_for('static', filename='scripts/racks-data.js') }}"></script>
        <script src="{{ url_for('static', filename='scripts/rack.js') }}"></script>
    </body>
</html>
